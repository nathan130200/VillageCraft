# TIPO: UnitFile / UnitPlan: estatísticas de combate. Não é uma profissão.
# Carregado uma vez na inicialização. Guia completo: Content/README.md.
# ID único da unidade; referências em Defender ou ctx.game.spawnMob.
Id = "piglin_brute"
# ID de Models usado para renderizar esta unidade.
