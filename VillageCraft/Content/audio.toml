# AudioSettings: Minecraft 1.16 OGG assets only, loaded once. All intervals are REAL seconds, unaffected by game speed.
# Maximum simultaneous native voices; higher-priority alerts can replace quiet effects.
MaxVoices = 12
# Maximum starts in a sliding one-second real-time window.
MaxStartsPerSecond = 8
# Starts reserved for settlement and boss alerts; ordinary effects cannot consume them.
ReservedAlertStarts = 2
# Maximum pending, deduplicated event requests; stale requests are never carried into another frame.
QueueLimit = 48
# Maximum spatial hearing distance in map tiles around the camera focus.
HearingRadius = 22
# Minimum real seconds between ordinary sound starts.
MinimumSpacing = 0.12
# Minimum real seconds between creature vocalizations.
CreatureSpacing = 0.7
# Minimum real seconds between ambient effects.
AmbienceSpacing = 5
# Real seconds between nearby creature samples (slightly randomized).
CreatureInterval = 3
# Real seconds between daytime/nighttime ambience checks.
AmbienceInterval = 16
# Real seconds between checks for a nearby flowing well.
WaterInterval = 6

# Footstep interval: minimum REAL seconds per moving entity.
FootstepInterval = 0.45
# Minimum real-time gap between audible crowd footsteps.
FootstepSpacing = 0.2
# Road prefab ID -> actual walking surface. Unknown roads fall back to stone.
RoadSurfaces = { path = "Gravel", cobble_road = "Stone", gravel_road = "Gravel", ice_road = "Stone", plank_road = "Wood", soul_road = "SoulSand", gate = "Wood" }
# Building prefab ID -> material under residents/workers inside the building footprint.
BuildingSurfaces = { cottage = "Wood", family_house = "Wood", small_warehouse = "Wood", large_warehouse = "Wood", lumber = "Wood", forge = "Stone", iron_foundry = "Stone", cave = "Stone", quarry = "Stone", well = "Stone" }

