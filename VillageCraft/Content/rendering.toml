# Minimum ambient light at night (0.15..0.6). Higher values keep the village readable.
NightAmbient = 0.4
# Minecraft's grayscale water needs a biome color. Temperate/plains default; no biome generator is required.
WaterTint = "#3F76E4"
WaterFragment = """
#version 330
in vec2 fragTexCoord;
in vec4 fragColor;
uniform sampler2D texture0;
out vec4 finalColor;
void main() {
    float detail = mix(0.72, 1.0, texture(texture0, fragTexCoord).r);
    // Source alpha is not opacity: otherwise pale lake beds wash out the biome tint.
    finalColor = vec4(fragColor.rgb * detail, 0.96);
}
"""
LightingVertex = """
#version 330
in vec3 vertexPosition;
in vec2 vertexTexCoord;
in vec3 vertexNormal;
in vec4 vertexColor;
uniform mat4 mvp;
out vec2 fragTexCoord;
out vec4 fragColor;
out vec3 worldPosition;
out vec3 worldNormal;
void main() {
    fragTexCoord = vertexTexCoord; fragColor = vertexColor;
    worldPosition = vertexPosition; worldNormal = vertexNormal;
    gl_Position = mvp * vec4(vertexPosition, 1.0);
}
"""
ShadowFragment = """
#version 330
in vec2 fragTexCoord;
in vec4 fragColor;
uniform sampler2D texture0;
uniform float shadowPassCheck;
out vec4 finalColor;
void main() {
    if (texture(texture0, fragTexCoord).a * fragColor.a < 0.1) discard;
    vec4 enc = fract((gl_FragCoord.z + shadowPassCheck) * vec4(16777216.0,65536.0,256.0,1.0));
    enc -= enc.xxyz * vec4(0.0,1.0/256.0,1.0/256.0,1.0/256.0);
    finalColor = enc;
}
"""
LightingFragment = """
#version 330
in vec2 fragTexCoord;
in vec4 fragColor;
in vec3 worldPosition;
in vec3 worldNormal;
uniform sampler2D texture0;
uniform sampler2D shadowMap;
uniform mat4 lightSpace;
uniform vec3 sunDirection;
uniform vec3 eyePosition;
uniform vec4 colDiffuse;
uniform float dayAmount;
uniform float ambientFloor;
uniform float shadowTexel;
uniform float shadowEnabled;
uniform float smoothShadows;
uniform float clock;
uniform float waterSurface;
out vec4 finalColor;
float depthAt(vec2 uv) { return dot(texture(shadowMap,uv),vec4(1.0/16777216.0,1.0/65536.0,1.0/256.0,1.0)); }
float shadow(vec3 normal) {
    if (shadowEnabled < 0.5) return 0.0;
    vec4 clip = lightSpace * vec4(worldPosition,1.0);
    vec3 p = clip.xyz/clip.w*0.5+0.5;
    if (p.x<0.0||p.x>1.0||p.y<0.0||p.y>1.0||p.z>1.0) return 0.0;
    float bias = max(0.000025,0.00012*(1.0-dot(normal,sunDirection)));
    if(smoothShadows<0.5) return p.z-bias > depthAt(p.xy) ? 1.0 : 0.0;
    float value=0.0,weights=0.0;
    for (int x=-2;x<=2;x++) for(int y=-2;y<=2;y++) {
        float weight=exp(-float(x*x+y*y)*0.4);
        value += (p.z-bias > depthAt(p.xy+vec2(x,y)*shadowTexel*1.2) ? 1.0 : 0.0)*weight;
        weights+=weight;
    }
    return value/weights;
}
void main() {
    vec4 texel = texture(texture0,fragTexCoord);
    if (waterSurface<0.5&&texel.a<0.1) discard;
    vec3 normal=normalize(worldNormal);
    if (!gl_FrontFacing) normal=-normal;
    vec3 view=normalize(eyePosition-worldPosition);
    vec3 material=texel.rgb*fragColor.rgb*colDiffuse.rgb;
    if (waterSurface>0.5) {
        normal=normalize(vec3(sin(worldPosition.x*1.6+clock*1.2)*0.12,1.0,cos(worldPosition.z*1.4-clock)*0.12));
        material=fragColor.rgb*mix(0.7,1.0,texel.r);
        float fresnel=pow(1.0-max(dot(normal,view),0.0),4.0);
        vec3 sky=mix(vec3(0.13,0.2,0.32),vec3(0.53,0.72,0.9),dayAmount);
        material=mix(material,sky,0.25+fresnel*0.45);
        material+=vec3(1.0,0.88,0.62)*pow(max(dot(reflect(-sunDirection,normal),view),0.0),96.0)*dayAmount*0.7;
    }
    float shade=shadow(normal);
    vec3 ambient=mix(vec3(1.0,1.08,1.2)*ambientFloor,vec3(0.5,0.55,0.61),dayAmount);
    float diffuse=max(dot(normal,sunDirection),0.0)*dayAmount*(1.0-shade*0.82);
    vec3 color=material*(ambient+vec3(1.0,0.92,0.78)*diffuse*0.68);
    float fog=clamp(1.0-exp(-length(eyePosition-worldPosition)*0.0018),0.0,0.45);
    vec3 fogColor=mix(vec3(0.13,0.19,0.25),vec3(0.64,0.76,0.82),dayAmount);
    color=mix(color,fogColor,fog);
    finalColor=vec4(color,waterSurface>0.5?0.97:fragColor.a);
}
"""
# TIPO: RenderingSettings: AlphaCutoff (0..1) e fragment shader GLSL CutoutFragment.
# Guia: Content/README.md. Carregado uma vez na inicialização.
# Cutout pixels must be discarded before they can update the depth buffer.
AlphaCutoff = 0.1
CutoutFragment = """
#version 330
in vec2 fragTexCoord;
in vec4 fragColor;
uniform sampler2D texture0;
uniform vec4 colDiffuse;
uniform float alphaCutoff;
out vec4 finalColor;
void main()
{
    vec4 texel = texture(texture0, fragTexCoord);
    if (texel.a < alphaCutoff) discard;
    // Texture alpha is coverage, rather than glass-like translucency.
    // Keep preview/tint alpha separate so placement ghosts still blend.
    finalColor = vec4(texel.rgb, 1.0) * colDiffuse * fragColor;
}
"""

# Optional world-only postprocessing. UI/font pixels are submitted afterwards.
EnhancedFragment = """
#version 330
in vec2 fragTexCoord;
in vec4 fragColor;
uniform sampler2D texture0;
uniform vec2 resolution;
uniform float dayAmount;
out vec4 finalColor;
float luma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
void main()
{
    vec2 uv = fragTexCoord;
    vec2 pixel = 1.0 / resolution;
    vec3 center = texture(texture0, uv).rgb;
    vec3 n = texture(texture0, uv + vec2(0, pixel.y)).rgb;
    vec3 s = texture(texture0, uv - vec2(0, pixel.y)).rgb;
    vec3 e = texture(texture0, uv + vec2(pixel.x, 0)).rgb;
    vec3 w = texture(texture0, uv - vec2(pixel.x, 0)).rgb;
    float low = min(luma(center), min(min(luma(n), luma(s)), min(luma(e), luma(w))));
    float high = max(luma(center), max(max(luma(n), luma(s)), max(luma(e), luma(w))));
    // A restrained edge blend softens raster edges without blurring all pixel textures.
    vec3 color = mix(center, (n+s+e+w)*0.25, smoothstep(0.14, 0.4, high-low)*0.28);
    vec3 glow = vec3(0);
    for (int x=-1; x<=1; x++) for (int y=-1; y<=1; y++) {
        vec3 tap = texture(texture0, uv + vec2(x,y)*pixel*4.0).rgb;
        glow += tap * smoothstep(0.65, 1.0, luma(tap));
    }
    color += glow * (0.09/9.0);
    vec3 tone = mix(vec3(0.95, 1.01, 1.09), vec3(1.045, 1.015, 0.965), dayAmount);
    color *= tone;
    color = mix(vec3(luma(color)), color, 1.07);
    color = (color-0.5)*1.025+0.5;
    // Lift dark tones slightly: enhanced nights must remain playable.
    color += (1.0-dayAmount)*0.025*(1.0-color);
    vec2 edge = uv*(1.0-uv);
    float vignette = mix(0.96, 1.0, smoothstep(0.0, 0.2, pow(edge.x*edge.y, 0.25)));
    finalColor = vec4(clamp(color*vignette, 0.0, 1.0), 1.0)*fragColor;
}
"""
