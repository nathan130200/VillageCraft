# VillageCraft content. Read once at startup; restart after editing.
FormatVersion = 1
Categories = ["Roads", "Housing", "Production", "Infrastructure", "Economy", "Animals", "Defense"]
DefaultMapWidth = 32
DefaultMapHeight = 32
